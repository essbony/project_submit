<svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <path d="M 0,100 L 1440,100 M 0,200 L 1440,200 M 0,300 L 1440,300 M 0,400 L 1440,400 M 0,500 L 1440,500 M 0,600 L 1440,600 M 0,700 L 1440,700" />
    <path d="M 200,0 L 200,810 M 400,0 L 400,810 M 600,0 L 600,810 M 800,0 L 800,810 M 1000,0 L 1000,810 M 1200,0 L 1200,810" />
  </g>

  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="1240" height="90" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)" />
    <rect x="20" y="20" width="6" height="50" rx="3" fill="url(#primaryGrad)" filter="url(#glow)"/>
    <text x="45" y="42" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="2">PRÉSENTATION TECHNIQUE</text>
    <text x="45" y="72" fill="#f8fafc" font-size="28" font-weight="700">Architecture &amp; Workflow du Projet</text>
    
    <g transform="translate(1080, 28)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#065f46" opacity="0.4"/>
      <rect x="0" y="0" width="120" height="34" rx="17" fill="none" stroke="#10b981" stroke-width="1"/>
      <circle cx="18" cy="17" r="5" fill="#10b981"/>
      <text x="35" y="22" fill="#34d399" font-size="13" font-weight="600">Actif / SVG</text>
    </g>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6,6">
    <path d="M 310,345 L 430,345" />
    <path d="M 730,345 L 850,345" />
    <path d="M 1150,345 L 1270,345" />
  </g>

  <g transform="translate(100, 200)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="210" height="290" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="105" cy="50" r="28" fill="#0369a1" opacity="0.4"/>
    <text x="105" y="58" fill="#38bdf8" font-size="22" font-weight="bold" text-anchor="middle">01</text>
    <text x="105" y="110" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Données / Code</text>
    <text x="25" y="150" fill="#94a3b8" font-size="13" text-anchor="start">- Analyse du fichier source</text>
    <text x="25" y="180" fill="#94a3b8" font-size="13" text-anchor="start">- Parsing SVG / XML</text>
    <text x="25" y="210" fill="#94a3b8" font-size="13" text-anchor="start">- Structure initiale</text>
    <rect x="25" y="235" width="160" height="30" rx="6" fill="#0369a1" opacity="0.3"/>
    <text x="105" y="255" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">Source Brute</text>
  </g>

  <g transform="translate(520, 200)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="210" height="290" rx="16" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="105" cy="50" r="28" fill="#7e22ce" opacity="0.4"/>
    <text x="105" y="58" fill="#d946ef" font-size="22" font-weight="bold" text-anchor="middle">02</text>
    <text x="105" y="110" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Traitement</text>
    <text x="25" y="150" fill="#94a3b8" font-size="13" text-anchor="start">- Application filtres</text>
    <text x="25" y="180" fill="#94a3b8" font-size="13" text-anchor="start">- Gestion des calques</text>
    <text x="25" y="210" fill="#94a3b8" font-size="13" text-anchor="start">- Optimisation viewBox</text>
    <rect x="25" y="235" width="160" height="30" rx="6" fill="#7e22ce" opacity="0.3"/>
    <text x="105" y="255" fill="#e879f9" font-size="12" font-weight="600" text-anchor="middle">Moteur Graphique</text>
  </g>

  <g transform="translate(940, 200)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="210" height="290" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <circle cx="105" cy="50" r="28" fill="#047857" opacity="0.4"/>
    <text x="105" y="58" fill="#34d399" font-size="22" font-weight="bold" text-anchor="middle">03</text>
    <text x="105" y="110" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Rendu &amp; Style</text>
    <text x="25" y="150" fill="#94a3b8" font-size="13" text-anchor="start">- Dégradés dynamiques</text>
    <text x="25" y="180" fill="#94a3b8" font-size="13" text-anchor="start">- Vectorisation propre</text>
    <text x="25" y="210" fill="#94a3b8" font-size="13" text-anchor="start">- Rendu responsive</text>
    <rect x="25" y="235" width="160" height="30" rx="6" fill="#047857" opacity="0.3"/>
    <text x="105" y="255" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">Interface UI</text>
  </g>

  <g transform="translate(100, 530)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="1240" height="210" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(40, 35)">
      <path d="M 0,10 L 20,0 L 20,20 Z" fill="#38bdf8"/>
      <text x="35" y="15" fill="#f8fafc" font-size="20" font-weight="700">Fonctionnement du projet</text>
      
      <text x="0" y="60" fill="#94a3b8" font-size="15" font-weight="400">
        Ce fichier SVG généré encapsule à la fois l'affichage visuel et la documentation schématique de votre structure.
      </text>
      <text x="0" y="90" fill="#94a3b8" font-size="15" font-weight="400">
        Il transforme un code brut ou des captures d'écran complexes en un composant graphique vectoriel net, entièrement personnalisable,
      </text>
      <text x="0" y="120" fill="#94a3b8" font-size="15" font-weight="400">
        scalable à l'infini et prêt à être intégré dans n'importe quel environnement web ou outil de présentation.
      </text>
    </g>

    <g transform="translate(900, 50)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="50" y="21" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">SVG Nativo</text>
    </g>
    <g transform="translate(1015, 50)" filter="url(#glow)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="50" y="21" fill="#e879f9" font-size="12" font-weight="600" text-anchor="middle">Vectoriel</text>
    </g>
    <g transform="translate(900, 95)">
      <rect x="0" y="0" width="215" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="107" y="21" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">Design Modulaire</text>
    </g>
  </g>
</svg>
</svg>