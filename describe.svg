<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <g stroke="#f1f5f9" stroke-width="1">
    <path d="M 0,100 L 1440,100 M 0,200 L 1440,200 M 0,300 L 1440,300 M 0,400 L 1440,400 M 0,500 L 1440,500 M 0,600 L 1440,600 M 0,700 L 1440,700 M 0,800 L 1440,800" />
    <path d="M 180,0 L 180,900 M 360,0 L 360,900 M 540,0 L 540,900 M 720,0 L 720,900 M 900,0 L 900,900 M 1080,0 L 1080,900 M 1260,0 L 1260,900" />
  </g>

  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="1280" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="40" y="38" fill="#0f172a" font-size="22" font-weight="700">NOMENCLATURE TECHNIQUE &amp; ARCHITECTURE — AWALÉ BOISSONS</text>
    <text x="40" y="65" fill="#64748b" font-size="14" font-weight="500">Schéma hiérarchique des flux de données, composants analytiques et pipelines d'intégration</text>
    
    <g transform="translate(1120, 28)">
      <rect x="0" y="0" width="120" height="34" rx="6" fill="#e0f2fe"/>
      <text x="60" y="22" fill="#0369a1" font-size="13" font-weight="600" text-anchor="middle">REF : SCH-01</text>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="6,4">
    <path d="M 380,335 L 500,335" marker-end="url(#arrow)"/>
    <path d="M 760,250 L 900,200" marker-end="url(#arrow)"/>
    <path d="M 760,420 L 900,470" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(80, 180)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="50" rx="10" fill="#f1f5f9"/>
    <path d="M 0,20 L 0,50 L 300,50 L 300,20 Z" fill="#f1f5f9"/>
    <text x="150" y="30" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">1. SOURCES DE DONNÉES</text>
    
    <g transform="translate(20, 75)">
      <circle cx="15" cy="15" r="12" fill="#e0f2fe"/>
      <text x="15" y="20" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">1.1</text>
      <text x="40" y="15" fill="#0f172a" font-size="13" font-weight="600">Magasins Physiques</text>
      <text x="40" y="32" fill="#64748b" font-size="11">Flux de caisse (Fichiers CSV)</text>
      <line x1="0" y1="50" x2="260" y2="50" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <g transform="translate(20, 150)">
      <circle cx="15" cy="15" r="12" fill="#dcfce7"/>
      <text x="15" y="20" fill="#16a34a" font-size="12" font-weight="bold" text-anchor="middle">1.2</text>
      <text x="40" y="15" fill="#0f172a" font-size="13" font-weight="600">WhatsApp Direct</text>
      <text x="40" y="32" fill="#64748b" font-size="11">Commandes clients (CSV)</text>
      <line x1="0" y1="50" x2="260" y2="50" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <g transform="translate(20, 225)">
      <circle cx="15" cy="15" r="12" fill="#ffedd5"/>
      <text x="15" y="20" fill="#ea580c" font-size="12" font-weight="bold" text-anchor="middle">1.3</text>
      <text x="40" y="15" fill="#0f172a" font-size="13" font-weight="600">Ads API (Meta &amp; TikTok)</text>
      <text x="40" y="32" fill="#64748b" font-size="11">Coûts publicitaires &amp; trafic</text>
    </g>
  </g>

  <g transform="translate(500, 180)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="50" rx="10" fill="#fef3c7"/>
    <path d="M 0,20 L 0,50 L 260,50 L 260,20 Z" fill="#fef3c7"/>
    <text x="130" y="30" fill="#78350f" font-size="14" font-weight="700" text-anchor="middle">2. TRANSFORMATION</text>

    <g transform="translate(20, 75)">
      <circle cx="15" cy="15" r="12" fill="#fee2e2"/>
      <text x="15" y="20" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="middle">2.1</text>
      <text x="40" y="15" fill="#0f172a" font-size="13" font-weight="600">dbt (Data Build Tool)</text>
      <text x="40" y="32" fill="#64748b" font-size="11">Modélisation &amp; Tests</text>
      <line x1="0" y1="50" x2="220" y2="50" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <g transform="translate(20, 150)">
      <circle cx="15" cy="15" r="12" fill="#e0e7ff"/>
      <text x="15" y="20" fill="#4f46e5" font-size="12" font-weight="bold" text-anchor="middle">2.2</text>
      <text x="40" y="15" fill="#0f172a" font-size="13" font-weight="600">DuckDB (Entrepôt)</text>
      <text x="40" y="32" fill="#64748b" font-size="11">Base locale my_db.duckdb</text>
      <line x1="0" y1="50" x2="220" y2="50" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <g transform="translate(20, 225)">
      <circle cx="15" cy="15" r="12" fill="#f1f5f9"/>
      <text x="15" y="20" fill="#475569" font-size="12" font-weight="bold" text-anchor="middle">2.3</text>
      <text x="40" y="15" fill="#0f172a" font-size="13" font-weight="600">Gestion .gitignore</text>
      <text x="40" y="32" fill="#64748b" font-size="11">Sécurisation des fichiers binaires</text>
    </g>
  </g>

  <g transform="translate(900, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="460" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="460" height="40" rx="10" fill="#e0f2fe"/>
    <path d="M 0,15 L 0,40 L 460,40 L 460,15 Z" fill="#e0f2fe"/>
    <text x="25" y="25" fill="#0369a1" font-size="13" font-weight="700">3.1 VISUALISATION — Apache Superset</text>

    <g transform="translate(20, 55)">
      <circle cx="15" cy="15" r="12" fill="#e0f2fe"/>
      <text x="15" y="20" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="middle">A</text>
      <text x="40" y="16" fill="#0f172a" font-size="12" font-weight="600">Tableaux de bord dynamiques</text>
      <text x="40" y="32" fill="#64748b" font-size="11">Suivi des canaux de vente et visibilité globale</text>
    </g>
  </g>

  <g transform="translate(900, 290)" filter="url(#shadow)">
    <rect x="0" y="0" width="460" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="460" height="40" rx="10" fill="#f3e8ff"/>
    <path d="M 0,15 L 0,40 L 460,40 L 460,15 Z" fill="#f3e8ff"/>
    <text x="25" y="25" fill="#7e22ce" font-size="13" font-weight="700">3.2 INTELLIGENCE ARTIFICIELLE — Agent Streamlit</text>

    <g transform="translate(20, 55)">
      <circle cx="15" cy="15" r="12" fill="#f3e8ff"/>
      <text x="15" y="20" fill="#9333ea" font-size="11" font-weight="bold" text-anchor="middle">B</text>
      <text x="40" y="16" fill="#0f172a" font-size="12" font-weight="600">Assistant Conversationnel</text>
      <text x="40" y="32" fill="#64748b" font-size="11">Requêtage naturel et gestion du cache système</text>
    </g>
  </g>

  <g transform="translate(80, 560)" filter="url(#shadow)">
    <rect x="0" y="0" width="1280" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="1280" height="45" rx="10" fill="#f1f5f9"/>
    <path d="M 0,15 L 0,45 L 1280,45 L 1280,15 Z" fill="#f1f5f9"/>
    <text x="40" y="27" fill="#334155" font-size="14" font-weight="700">4. COMPOSANTS TRANSVERSAUX (SÉCURITÉ, VERSIONING &amp; DÉPLOIEMENT)</text>

    <g transform="translate(40, 70)">
      <circle cx="20" cy="20" r="16" fill="#e0f2fe"/>
      <text x="20" y="25" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">4.1</text>
      <text x="55" y="15" fill="#0f172a" font-size="13" font-weight="600">Sécurité &amp; .env</text>
      <text x="55" y="32" fill="#64748b" font-size="11">Protection des clés API et identifiants sensibles</text>
    </g>

    <g transform="translate(480, 70)">
      <circle cx="20" cy="20" r="16" fill="#ffedd5"/>
      <text x="20" y="25" fill="#ea580c" font-size="12" font-weight="bold" text-anchor="middle">4.2</text>
      <text x="55" y="15" fill="#0f172a" font-size="13" font-weight="600">Git &amp; Nettoyage</text>
      <text x="55" y="32" fill="#64748b" font-size="11">Gestion des historiques et purge des fichiers superflus</text>
    </g>

    <g transform="translate(920, 70)">
      <circle cx="20" cy="20" r="16" fill="#dcfce7"/>
      <text x="20" y="25" fill="#16a34a" font-size="12" font-weight="bold" text-anchor="middle">4.3</text>
      <text x="55" y="15" fill="#0f172a" font-size="13" font-weight="600">Streamlit Cloud</text>
      <text x="55" y="32" fill="#64748b" font-size="11">Mise en production et optimisation des performances</text>
    </g>
  </g>

</svg>
